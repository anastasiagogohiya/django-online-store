openapi: 3.0.3
info:
  title: MEGANO shop project API
  version: 1.0.0
  description: API для интернет-магазина
paths:
  /api/banners/:
    get:
      operationId: banners_list
      description: Возвращает список баннеров для отображения. До 4 баннеров, чтобы
        в фронтэнде было красивое отображение
      summary: Получение баннеров
      tags:
      - catalog
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Banner'
              examples:
                ПолучениеБаннеров:
                  value:
                  - - id: '123'
                      category: 55
                      price: 500.67
                      count: 12
                      date: Thu Feb 09 2023 21:39:52 GMT+0100 (Central European Standard
                        Time)
                      title: video card
                      description: description of the product
                      freeDelivery: true
                      images:
                      - src: https://proprikol.ru/wp-content/uploads/2020/12/kartinki-ryabchiki-14.jpg
                        alt: hello alt
                      tags:
                      - id: 0
                        name: Hello world
                      reviews: 5
                      rating: 4.6
                  summary: Получение баннеров
          description: ''
  /api/basket/:
    get:
      operationId: basket_list
      description: Получение корзины пользователя или сессии
      summary: Получение корзины
      tags:
      - basket
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasketItemDetail'
              examples:
                ПримерКорзины:
                  value:
                  - - id: 123
                      category: 55
                      price: 500.67
                      count: 12
                      date: Thu Feb 09 2023 21:39:52 GMT+0100 (Central European Standard
                        Time)
                      title: video card
                      description: description of the product
                      freeDelivery: true
                      images:
                      - src: https://proprikol.ru/wp-content/uploads/2020/12/kartinki-ryabchiki-14.jpg
                        alt: hello alt
                      tags:
                      - id: 0
                        name: Hello world
                      reviews: 5
                      rating: 4.6
                    - id: 124
                      category: 55
                      price: 201.675
                      count: 5
                      date: Thu Feb 09 2023 21:39:52 GMT+0100 (Central European Standard
                        Time)
                      title: video card
                      description: description of the product
                      freeDelivery: true
                      images:
                      - src: https://proprikol.ru/wp-content/uploads/2020/12/kartinki-ryabchiki-14.jpg
                        alt: hello alt
                      tags:
                      - id: 0
                        name: Hello world
                      reviews: 5
                      rating: 4.6
                  summary: Пример корзины
          description: ''
    post:
      operationId: basket_create
      description: Добавление товара в корзину или обновление количества
      summary: Добавление товара в корзину
      tags:
      - basket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketItemRequest'
            examples:
              ПримерТелаЗапроса:
                value:
                  id: 12
                  count: 5
                summary: Пример тела запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BasketItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BasketItemRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasketItemDetail'
              examples:
                ПримерУспешногоОтвета:
                  value:
                  - - id: 123
                      category: 55
                      price: 500.67
                      count: 12
                      date: '2023-02-09T20:39:52Z'
                      title: video card
                      description: description of the product
                      freeDelivery: true
                      images:
                      - src: https://example.com/image.jpg
                        alt: hello alt
                      tags:
                      - id: 0
                        name: Hello world
                      reviews: 5
                      rating: 4.6
                  summary: Пример успешного ответа
          description: ''
    delete:
      operationId: basket_destroy
      description: Удаление товара из корзины или уменьшение количества
      summary: Удаление товара из корзины или уменьшение количества
      parameters:
      - in: query
        name: count
        schema:
          type: integer
        description: Количество для удаления (для тестирования в Swagger)
      - in: query
        name: id
        schema:
          type: integer
        description: ID товара (для тестирования в Swagger)
      tags:
      - basket
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasketItemDetail'
          description: ''
  /api/catalog/:
    get:
      operationId: get_catalog_items
      description: get catalog items
      parameters:
      - in: query
        name: category
        schema:
          type: number
      - in: query
        name: currentPage
        schema:
          type: number
          default: 1
      - in: query
        name: filter
        schema:
          $ref: '#/components/schemas/FilterParamsRequest'
        description: search text
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - date
          - price
          - rating
          - title
          default: date
      - in: query
        name: sortType
        schema:
          type: string
          enum:
          - dec
          - inc
          default: dec
      - in: query
        name: tags
        schema:
          $ref: '#/components/schemas/TagFilterRequest'
        description: page
      tags:
      - catalog
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ПримерОтвета:
                  value:
                    items:
                    - id: 123
                      category: 55
                      price: 500.67
                      count: 12
                      date: Thu Feb 09 2023 21:39:52 GMT+0100
                      title: video card
                      description: description of the product
                      freeDelivery: true
                      images:
                      - src: /3.png
                        alt: Image alt string
                      tags:
                      - id: 12
                        name: Gaming
                      reviews: 5
                      rating: 4.6
                    currentPage: 1
                    lastPage: 10
                  summary: Пример ответа
          description: Успешный ответ
  /api/categories/:
    get:
      operationId: categories_list
      summary: Получение списка категорий
      tags:
