          type: string
          format: email
          readOnly: true
        text:
          type: string
          title: Отзыв покупателя
          maxLength: 500
        rate:
          type: integer
          maximum: 32767
          minimum: 0
          title: Оценка пользователя (от 1 до 5 вкл.)
        date:
          type: string
          readOnly: true
        avatar:
          type: string
          readOnly: true
      required:
      - author
      - avatar
      - date
      - email
      - rate
      - text
    Sales:
      type: object
      description: Сериализатор для товаров со скидкой
      properties:
        id:
          type: integer
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Цена товара
        salePrice:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        dateFrom:
          type: string
          nullable: true
          readOnly: true
        dateTo:
          type: string
          nullable: true
          readOnly: true
        title:
          type: string
          title: Название товара
          maxLength: 100
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          readOnly: true
      required:
      - dateFrom
      - dateTo
      - id
      - images
      - price
      - salePrice
      - title
    Specification:
      type: object
      description: Сериализатор для спецификации
      properties:
        name:
          type: string
          title: Название
          maxLength: 100
        value:
          type: string
          title: Значение
          maxLength: 100
      required:
      - name
      - value
    Tag:
      type: object
      description: Сериализатор для тегов
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название тэга
          maxLength: 45
      required:
      - id
      - name
    TagFilterRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
      required:
      - id
      - name
    TagRequest:
      type: object
      description: Сериализатор для тегов
      properties:
        name:
          type: string
          minLength: 1
          title: Название тэга
          maxLength: 45
      required:
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
